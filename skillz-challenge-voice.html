<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B0B2E">
<title>Skillz Challenge — Voice Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one phone-width column; the painted wheel, the cream card and the mic are the focal objects */
:root{
  --bg:#1B0B2E;--surface:#2B1650;--surface-2:#351C60;--line:#4A2C7A;
  --green:#3DF56B;--pink:#FF2E87;--pink-deep:#4A0B2A;
  --card:#FBEAE3;--ink:#3B1B05;--orange:#E4802E;--orange-deep:#C25E12;
  --violet:#8B6FD4;--text:#FFFFFF;--muted:#B9A5D9;--dim:#7E66AB;--amber:#FFC24D;
  --display:"Anton","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Helvetica Neue",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:430px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.chip{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}
.logo{font-family:var(--display);font-size:30px;color:#fff;line-height:1;transform:skewX(-7deg);text-shadow:2px 2px 0 var(--violet)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);margin:0}
.eyebrow.o{color:var(--orange)}
h1.screen{font-family:var(--display);font-size:clamp(30px,8.5vw,40px);line-height:1.02;margin:4px 0 6px;text-transform:uppercase;letter-spacing:.5px;text-wrap:balance}
.lede{margin:0 0 4px;color:var(--muted);font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{width:100%;border:0;border-radius:14px;padding:17px 18px;cursor:pointer;font-family:var(--display);font-size:19px;letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-orange{background:var(--orange);color:#2B1003}
.btn-green{background:var(--green);color:#06230F}
.btn-pink{background:var(--pink);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--violet);color:#CDBCF0}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.modebtn:focus-visible,.pickbtn:focus-visible,input:focus-visible,#micBtn:focus-visible,#wheelBtn:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.foot{text-align:center;color:var(--dim);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin:2px 0 0}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.who .av{width:36px;height:36px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.who .m{flex:1;min-width:0}
.who .m b{display:block;font-size:14.5px;font-weight:600}
.who .m span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);flex:none}
.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 4px;cursor:pointer;color:var(--text);font-family:var(--body);display:flex;flex-direction:column;align-items:center;gap:2px}
.opt .n{font-family:var(--display);font-size:21px;line-height:1}
.opt .s{font-size:9.5px;color:var(--dim)}
.opt[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#2B1003}
.opt[aria-pressed="true"] .s{color:#5A2A05}
.modes{display:flex;flex-direction:column;gap:9px}
.modebtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;color:var(--text);font-family:var(--body)}
.modebtn .av{width:36px;height:36px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.modebtn .t{flex:1;min-width:0}
.modebtn .t b{display:block;font-family:var(--display);font-size:16px;letter-spacing:.5px}
.modebtn .t em{font-style:normal;font-size:12.5px;color:var(--muted);display:block;line-height:1.35}
.modebtn .dot{width:21px;height:21px;border-radius:50%;border:2px solid var(--line);flex:none}
.modebtn[aria-pressed="true"]{border-color:var(--orange);background:#3A2410}
.modebtn[aria-pressed="true"] .dot{border-color:var(--orange);background:var(--orange)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 7px}

.wheelwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:2px 0}
#wheelBtn{background:none;border:0;padding:0;cursor:pointer;position:relative;line-height:0;border-radius:50%;width:min(300px,78vw);max-width:100%}
#wheelImg{width:100%;height:auto;display:block;transition:transform 4s cubic-bezier(.17,.67,.14,1);transform-origin:50% 50%}
.needle{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:28px;color:var(--pink);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:0}

.ccard{background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:16px 16px 18px;
  display:flex;flex-direction:column;gap:11px;text-align:center}
.ccard .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ccard .mark{font-family:var(--display);font-size:22px;color:#fff;line-height:1;transform:skewX(-7deg);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.ccard .sec{font-family:var(--display);font-size:17px;color:var(--ink);letter-spacing:.5px;font-variant-numeric:tabular-nums}
.ccard .sec.low{color:#B4210F}
.ccard .sec.idle{color:#9A7C62}
.ccard .sec.done{color:#1E6B2E}
.ccard .body{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:6px 0}
.ccard .kicker{font-family:var(--display);font-size:21px;color:var(--orange);letter-spacing:.5px}
.ccard .word{font-family:var(--display);font-size:clamp(30px,10vw,42px);color:var(--orange-deep);text-transform:uppercase;letter-spacing:1px;line-height:1.05}
.ccard .moves{font-family:var(--display);font-size:14px;color:var(--orange);letter-spacing:.6px;text-transform:uppercase}
.ccard.big .verdictword{font-family:var(--display);font-size:clamp(30px,10vw,42px);color:var(--orange-deep);text-transform:uppercase;letter-spacing:1px}

.loss{border:3px solid var(--ink);border-radius:18px;padding:15px 16px;background:#F6DAD0;color:var(--ink);text-align:center;
  display:flex;flex-direction:column;gap:5px}
.loss .lbl2{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#A33B18}
.loss .nameline{font-family:var(--display);font-size:clamp(22px,7vw,28px);text-transform:uppercase;letter-spacing:.6px;color:#8C1437}
.loss .wordline{font-size:15px;color:#5A3A20}
.loss .wordline b{font-family:var(--display);font-size:21px;color:#8C1437;letter-spacing:.5px;text-transform:uppercase}
.loss .why{font-size:13px;color:#6B4524}

.turnbar{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.turnbar.you{border-color:var(--orange);background:#3A2410}
.turnbar.cpu{border-color:var(--violet);background:#2A1C47}
.turnbar .av{width:34px;height:34px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.turnbar .m{flex:1;min-width:0}
.turnbar .m b{display:block;font-size:15px;font-weight:600}
.turnbar .m span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.thinking{display:flex;gap:4px;align-items:center;flex:none}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--violet);display:block;animation:bob 1s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

.miczone{display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 0}
#micBtn{width:88px;height:88px;border-radius:50%;border:3px solid var(--line);background:var(--surface);
  color:var(--muted);font-size:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#micBtn:active{transform:scale(.96)}
#micBtn.live{background:var(--pink);border-color:var(--pink);color:#fff;animation:pulse 1.3s ease-in-out infinite}
#micBtn.starting{background:var(--surface-2);border-color:var(--violet);color:#CDBCF0}
#micBtn.got{background:var(--green);border-color:var(--green);color:#06230F}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,46,135,.55)}50%{box-shadow:0 0 0 15px rgba(255,46,135,0)}}
#partial{font-size:14px;color:var(--violet);font-style:italic;min-height:19px;text-align:center;margin:0;word-break:break-word}

.chain{display:flex;flex-wrap:wrap;gap:7px}
.chainword{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px 5px 7px;font-size:13.5px}
.chainword.you{border-color:var(--orange)}
.chainword.fail{border-color:var(--pink);background:#3A1026;color:#FFC9DF;text-decoration:line-through}
.chainword .dot{width:16px;height:16px;border-radius:50%;flex:none;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;background:var(--violet);color:#1B0B2E}
.chainword.you .dot{background:var(--orange);color:#2B1003}
.chainword.fail .dot{background:var(--pink);color:#fff;text-decoration:none}
.chaincount{font-size:11.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.pickbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px;color:var(--text);font-family:var(--body)}
.pickbtn .av{width:34px;height:34px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.pickbtn b{flex:1;min-width:0;font-size:15px;font-weight:600}
.pickbtn .go{color:var(--orange);font-size:17px}
input.text{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:13px;padding:15px;color:#fff;font-family:var(--body);font-size:18px}
input.text:focus{border-color:var(--orange);outline:none}
input.text::placeholder{color:#6B5595}
.warn{background:#3A2A06;border:1px solid var(--amber);border-radius:13px;padding:13px 14px;font-size:13.5px;color:#FFE4AE;line-height:1.45}
.warn b{color:var(--amber)}
.underline{font-size:12px;color:var(--dim);text-align:center;margin:0}
.exportrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.exportrow .btn{padding:13px 10px;font-size:15px}

.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:9px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--surface);border-radius:13px;padding:13px 10px;text-align:center}
.stat b{font-family:var(--display);font-size:27px;line-height:1;display:block}
.stat span{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.logrow{border-bottom:1px solid var(--line);padding:12px 0}
.logrow:last-child{border-bottom:0}
.logrow .lq{font-size:13px;margin:0 0 6px;color:var(--muted)}
.logrow .lq strong{color:var(--orange)}
.logrow .la{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.logrow .lost{font-size:12.5px;color:#FF9BC5;margin:6px 0 0}
.logrow .lost b{color:#fff}
.pill{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:999px;padding:2px 8px;flex:none}
.pill.ok{background:var(--green);color:#06230F}
.pill.no{background:var(--pink);color:#fff}
.pill.flag{background:#C98A1E;color:#2A1A02}
.pill.late{background:var(--violet);color:#1B0B2E}
.pill.spoke{background:var(--violet);color:#1B0B2E}
@media (prefers-reduced-motion:reduce){#wheelImg{transition-duration:.3s}.thinking i{animation:none;opacity:.7}#micBtn.live{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="chip" id="backBtn" aria-label="Back">&#8592;</button>
    <div class="logo">Skillz</div>
  </div>
  <div id="view"></div>
</div>

function normalize(s){
  return (s||"").toLowerCase().replace(/[‘’'`]/g,"")
    .replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
}
/* Judges one turn. Verdicts: correct, spelling (letters only — flag for review),
   repeat (already said, or the card's own word), wrong. */
function judgeTurn(input,item,used){
  const raw=normalize(input);
  if(!raw)return{verdict:"wrong",reason:"nothing said",matched:null};
  const prompt=normalize(item.w);
  const words=raw.split(" ").filter(Boolean);
  const set=item.r.map(normalize);
  const seen=used.map(normalize);
  for(const w of words){
    if(w===prompt)return{verdict:"repeat",reason:"that's the card's own word",matched:w};
    if(seen.includes(w))return{verdict:"repeat",reason:"already said this battle",matched:w};
  }
  for(const w of words){ if(set.includes(w))return{verdict:"correct",reason:"listed rhyme",matched:w}; }
  for(const w of words){
    if(w.length<3)continue;
    const tail=Math.min(3,Math.min(w.length,prompt.length));
    if(w.slice(-tail)===prompt.slice(-tail))return{verdict:"spelling",reason:"ending matches on letters",matched:w};
  }
  return{verdict:"wrong",reason:"doesn't rhyme",matched:words[words.length-1]||null};
}

function wire(){
  const on=(id,fn,ev="click")=>{const n=el(id);if(n)n.addEventListener(ev,fn);};
  on("startBtn",()=>go("setup"));
  document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{S.mode=b.dataset.mode;render();}));
  document.querySelectorAll("[data-size]").forEach(b=>b.addEventListener("click",()=>{S.crew=+b.dataset.size;render();}));
  on("toSpin",()=>{S.spinAngle=0;S.spinning=false;go("spin");});
  on("wheelBtn",spin);
  on("drawBtn",()=>{ if(S.mode==="solo")openBattle(null); else go("pick"); });
  document.querySelectorAll("[data-opp]").forEach(b=>b.addEventListener("click",()=>openBattle(b.dataset.opp)));
  on("armBtn",armTurn);
  on("micBtn",toggleMic);
  on("lockBtn",submitTurn);
  const a=el("answer");
  if(a){a.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submitTurn();}});}
  on("nextBtn",()=>{S.idx++;if(S.idx>=BATTLES){go("summary");saveSession();}else{S.spinAngle=0;S.spinning=false;go("spin");}});
  on("checkBtn",micCheckStart);
  on("copyBtn",copyResults);
  on("dlBtn",downloadResults);
  on("clearBtn",clearResults);
  on("againBtn",()=>{S.queue=shuffle(DECK).slice(0,BATTLES);S.idx=0;S.wins=0;S.log=[];S.battle=null;
    S.startedAt=Date.now();S.sessionId=Math.random().toString(36).slice(2,8).toUpperCase();S.spinAngle=0;go("home");});
  if(S.screen==="home")paintAvail();
}
function paintAvail(){
  const n=el("micAvail");
  if(!n)return;
  n.innerHTML=S.dictReady?"":
    `<div class="warn" style="margin-top:4px"><b>Heads up.</b> ${esc(S.micError||"This browser won't do speech recognition. Safari on iPhone or Chrome on Android both will \u2014 battles still work by typing here.")}</div>`;
}
el("backBtn").addEventListener("click",()=>{
  stopClock();stopCpu();stopMic();
  const back={setup:"home",spin:"setup",pick:"spin",battle:S.mode==="solo"?"spin":"pick",result:"spin",summary:"home"}[S.screen];
  if(back)go(back);
});

/* The wheel's eight wedges run T, K, Q, C twice, with boundaries on the 45s,
   so the C centres are at 157.5 and 337.5 degrees clockwise from the top. */
function spin(){
  if(S.spinning)return;S.spinning=true;
  const box=el("landedBox"),draw=el("drawBtn"),hint=el("wheelHint");
  if(box)box.hidden=true; if(draw)draw.disabled=true; if(hint)hint.textContent="Spinning…";
  const centre=[157.5,337.5][Math.floor(Math.random()*2)];
  const final=(4+Math.floor(Math.random()*3))*360+(360-centre)+((Math.random()*16)-8);
  const img=el("wheelImg");
  requestAnimationFrame(()=>{if(img)img.style.transform=`rotate(${final}deg)`;});
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{S.spinAngle=final%360;S.spinning=false;
    if(hint)hint.textContent="Tap again to re-spin";
    if(box)box.hidden=false;
    if(draw){draw.disabled=false;draw.textContent="Draw Challenge →";}
  },reduce?320:4050);
}

function openBattle(oppId){
  const you={...ROSTER[0]};
  const opp=S.mode==="solo"?{...CPU}:{...(ROSTER.find(p=>p.id===oppId)||ROSTER[1])};
  S.battle={card:S.queue[S.idx],word:S.queue[S.idx].w,
    players:[you,opp],turn:0,chain:[],armed:false,landed:false,flagged:0,edits:0,startedAt:Date.now()};
  S.remaining=CLOCK;S.heard="";S.spoke=false;
  go("battle");
}
/* One tap arms the turn: it starts the clock and the mic together, because
   start() has to run straight off the viewer's click. */
function armTurn(){
  S.battle.armed=true;S.battle.landed=false;
  S.remaining=CLOCK;S.battle.turnStart=Date.now();S.heard="";S.spoke=false;
  if(S.dictReady){ S.spoke=true; startMic(); }
  render();startClock();
}
function toggleMic(){
  if(!S.rec)return;
  if(S.recActive){ stopMic(); return; }
  S.spoke=true;
  startMic();
}
function onMicError(name){
  const msg={
    "no-speech":"Didn't catch anything. Tap the mic and try again.",
    "aborted":"",
    "audio-capture":"No microphone found on this device. Type your rhyme instead.",
    "not-allowed":"Microphone access was blocked. Allow it in your browser's site settings, then reload.",
    "service-not-allowed":"Speech recognition was refused. This page has to be served over https \u2014 check the address bar.",
    "network":"The speech service couldn't be reached. Check your connection or type it.",
    "language-not-supported":"This language isn't supported for speech here. Type instead."
  }[name];
  if(name==="not-allowed"||name==="service-not-allowed"||name==="audio-capture"){
    S.dictReady=false;S.micError=msg;render();return;
  }
  const h=el("micHint"); if(h&&msg)h.textContent=msg;
}
/* iOS ends recognition after each utterance, so start() is per turn, and a
   start on an already-running recognizer throws rather than rejecting.
   iOS also refuses the mic while anything is still being spoken, so the
   Sucka MC's voice is cut off before the recognizer opens. */
function startMic(){
  if(!S.rec||S.recActive)return;
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ S.rec.start();S.recActive=true;S.micState="starting";paintMic(); }
  catch(e){ S.recActive=false; }
}
/* The first start() raises the OS permission prompt, which would eat a
   five-second turn, so the home screen offers to get it over with. */
function micCheckStart(){
  if(!S.dictReady)return;
  const o=el("checkOut"); if(o)o.textContent="Listening\u2026 say anything.";
  S.micCheck=true;
  startMic();
}
function stopMic(){ if(S.rec&&S.recActive){ try{S.rec.stop();}catch(e){} } }
/* Never speak while the recognizer is open or the page hears itself. */
function say(text){
  if(!S.ttsOk||S.recActive)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.rate=0.95;u.pitch=0.9;u.lang="en-US";
    speechSynthesis.speak(u);
  }catch(e){}
}
function paintMic(){
  const b=el("micBtn"),h=el("micHint");
  if(!b)return;
  if(S.battle&&S.battle.landed){ b.className="got"; if(h)h.textContent="Got it — fix it or send it"; return; }
  b.className=S.micState==="listening"?"live":(S.micState==="starting"||S.micState==="finishing")?"starting":"";
  if(h)h.textContent={idle:"Say a word that rhymes",starting:"Opening the mic…",
    listening:"Listening…",finishing:"Catching the last words…"}[S.micState];
}

function startClock(){
  stopClock();
  S.timer=setInterval(()=>{
    S.remaining--;
    const c=el("clock");
    if(c){c.textContent=Math.max(0,S.remaining)+" sec";c.classList.toggle("low",S.remaining<=2);}
    if(S.remaining<=0){
      stopClock();
      const f=el("answer");
      if(f&&f.value.trim()){ const cc=el("clock"); if(cc){cc.textContent="Got it";cc.className="sec done";} return; }
      endBattle("never got a word out in time",null,true);
    }
  },1000);
}
function stopClock(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
function stopCpu(){if(S.cpuTimer){clearTimeout(S.cpuTimer);S.cpuTimer=null;}}

function advance(word,flagged,heard){
  const b=S.battle;
  const edited=heard&&normalize(heard)!==normalize(word);
  if(edited)b.edits++;
  b.chain.push({word,you:b.players[b.turn].you===true,
    player:b.players[b.turn].name,flagged:!!flagged,
    spoke:!!heard,heard:heard||""});
  if(flagged)b.flagged++;
  b.turn=b.turn===0?1:0;
  b.armed=false;b.landed=false;S.remaining=CLOCK;S.heard="";S.spoke=false;
  render();
  if(b.players[b.turn].cpu)scheduleCpu();
}
/* The Sucka MC plays an unused rhyme from the card, and gets likelier to blank
   as the chain grows, so a battle ends instead of running the list dry. */
function scheduleCpu(){
  stopCpu();
  S.cpuTimer=setTimeout(()=>{
    const b=S.battle;
    if(!b||S.screen!=="battle")return;
    const used=b.chain.map(c=>normalize(c.word));
    const open=b.card.r.filter(w=>!used.includes(normalize(w)));
    const blank=Math.min(0.55,0.06+0.05*b.chain.length);
    if(!open.length||Math.random()<blank){
      endBattle(open.length?"couldn't come back in time":"ran out of rhymes",null,!!open.length);
      return;
    }
    const pick=open[Math.floor(Math.random()*open.length)];
    say(pick);
    advance(pick,false,"");
  },1200+Math.random()*1600);
}

function submitTurn(){
  if(S.screen!=="battle"||!S.battle.armed)return;
  stopClock();stopMic();
  const b=S.battle,f=el("answer"),typed=f?f.value.trim():"";
  const used=b.chain.map(c=>c.word);
  const r=judgeTurn(typed,b.card,used);
  if(r.verdict==="correct"||r.verdict==="spelling"){ advance(typed,r.verdict==="spelling",S.spoke?S.heard:""); return; }
  endBattle(r.reason,typed,false);
}
function endBattle(reason,losingWord,ranOut){
  stopClock();stopCpu();stopMic();
  const b=S.battle,loser=b.players[b.turn],youLost=loser.you===true;
  if(!youLost)S.wins++;
  const used=b.chain.map(c=>normalize(c.word));
  S.log.push({n:S.log.length+1,cardId:b.card.id,word:b.word,mode:S.mode,
    opponent:b.players[1].name,chain:b.chain.slice(),
    winner:youLost?"opponent":"you",
    loser:loser.name,loserLabel:youLost?"You":loser.name,
    reason,losingWord:losingWord||"",ranOut:!!ranOut,
    flagged:b.flagged,edits:b.edits,
    wouldWork:b.card.r.filter(w=>!used.includes(normalize(w))).slice(0,4).join(", "),
    seconds:Math.round((Date.now()-b.startedAt)/1000)});
  go("result");
}

const LSKEY="skillz_challenge_voice_sessions";
function allSessions(){
  try{ return JSON.parse(localStorage.getItem(LSKEY)||"[]"); }catch(e){ return []; }
}
function saveSession(){
  const line=el("saveLine");
  const rec={
    sessionId:S.sessionId,mode:S.mode==="solo"?"challenge-voice-solo":"challenge-voice-pass",
    crew:S.mode==="solo"?1:S.crew,clockSeconds:CLOCK,
    speechAvailable:!!S.dictReady,voiceAvailable:!!S.ttsOk,
    userAgent:navigator.userAgent,
    battles:S.log.length,wins:S.wins,
    totalWords:S.log.reduce((s,r)=>s+r.chain.length,0),
    spokenWords:S.log.reduce((s,r)=>s+r.chain.filter(c=>c.spoke).length,0),
    corrected:S.log.reduce((s,r)=>s+r.edits,0),
    longestChain:S.log.reduce((m,r)=>Math.max(m,r.chain.length),0),
    clockLosses:S.log.filter(r=>r.ranOut).length,
    spellingOnly:S.log.reduce((s,r)=>s+r.flagged,0),
    startedAt:S.startedAt,finishedAt:Date.now(),exchanges:S.log};
  let all=allSessions();
  all.push(rec);
  try{
    localStorage.setItem(LSKEY,JSON.stringify(all));
    if(line)line.textContent="Saved on this device \u2014 "+all.length+" session"+(all.length===1?"":"s")+" stored.";
  }catch(e){
    if(line)line.textContent="Couldn't save to this device \u2014 copy the results below before closing.";
  }
}
function exportBlob(){ return new Blob([JSON.stringify(allSessions(),null,2)],{type:"application/json"}); }
async function copyResults(){
  const note=el("exportNote"),txt=JSON.stringify(allSessions(),null,2);
  try{ await navigator.clipboard.writeText(txt); if(note)note.textContent="Copied every session on this device to the clipboard."; }
  catch(e){ if(note)note.textContent="Clipboard refused \u2014 use Download instead."; }
}
function downloadResults(){
  const note=el("exportNote");
  try{
    const a=document.createElement("a"),url=URL.createObjectURL(exportBlob());
    a.href=url;a.download="skillz-challenge-voice-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    if(note)note.textContent="Downloaded every session on this device.";
  }catch(e){ if(note)note.textContent="Download refused \u2014 use Copy instead."; }
}
function clearResults(){
  try{ localStorage.removeItem(LSKEY); }catch(e){}
  const note=el("exportNote"); if(note)note.textContent="Cleared. New sessions start from zero.";
}

/* Speech recognition is set up once; iOS closes it after each utterance, so
   a turn is one start() and the page restarts it on the next tap. */
(function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ S.dictReady=false; return; }
  let r;
  try{ r=new SR(); }catch(e){ S.dictReady=false; return; }
  r.continuous=false;r.interimResults=true;r.lang="en-US";r.maxAlternatives=1;
  r.onstart=()=>{ S.recActive=true;S.micState="listening";paintMic(); };
  r.onresult=(e)=>{
    let interim="",final="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];
      if(res.isFinal)final+=res[0].transcript; else interim+=res[0].transcript;
    }
    if(S.micCheck){
      const o=el("checkOut");
      if(o&&(final||interim))o.textContent="Heard: \u201c"+(final||interim).trim()+"\u201d";
      return;
    }
    const p=el("partial"); if(p)p.textContent=interim;
    if(!final)return;
    const f=el("answer"); if(!f)return;
    const piece=f.value.trim()===""?String(final).replace(/^\s+/,""):" "+String(final).trim();
    f.value=f.value+piece;
    S.heard=(S.heard||"")+piece;
    if(p)p.textContent="";
    /* A word landed inside the window, which is what the clock is for. */
    if(S.battle&&S.battle.armed&&!S.battle.landed&&f.value.trim()){
      S.battle.landed=true;stopClock();
      const c=el("clock"); if(c){c.textContent="Got it";c.className="sec done";}
      paintMic();
    }
  };
  r.onerror=(e)=>{ S.recActive=false; onMicError(e&&e.error); };
  r.onend=()=>{ S.recActive=false;S.micState="idle";paintMic();
    const p=el("partial"); if(p)p.textContent="";
    if(S.micCheck){
      S.micCheck=false;
      const o=el("checkOut");
      if(o&&/^Listening/.test(o.textContent))o.textContent="Nothing came through. Tap again, or check the mic isn't muted.";
      else if(o&&o.textContent)o.textContent+=" \u2014 mic works. You're set.";
    } };
  S.rec=r;S.dictReady=true;
  S.ttsOk=typeof window.speechSynthesis!=="undefined"&&typeof window.SpeechSynthesisUtterance!=="undefined";
})();

render();
</script>
